name: Flatter (signed)

on:
  push:
  workflow_dispatch:
  schedule:
    # Rebuild weekly to catch upstream changes
    - cron: "0 2 * * 0"

jobs:
  flatter:
    name: Build Flatpak Packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    container:
      image: ghcr.io/andyholmes/flatter/freedesktop:25.08
      options: --privileged

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup GPG
        # Skip GPG signing for pull requests (requires secrets from repo owner)
        if: ${{ github.triggering_actor == github.repository_owner && github.event_name != 'pull_request' }}
        id: gpg
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Install Flatpak Dependencies
        # The freedesktop Flatter image ships the Platform/Sdk but not
        # extensions or base apps our manifest needs: the golang extension
        # (to build host-spawn) and the Electron BaseApp (our `base:`,
        # providing zypak). flatpak-builder doesn't auto-install either -
        # unlike a local `--install-deps-from=flathub` build, Flatter's own
        # flatpak-builder invocation has no such flag, so both must already
        # be present before "Build Packages" runs.
        run: |
          flatpak install --noninteractive flathub \
            org.freedesktop.Sdk.Extension.golang//25.08 \
            org.electronjs.Electron2.BaseApp//25.08

      - name: Build Packages
        id: flatter
        uses: andyholmes/flatter@main
        with:
          files: |
            src/ai.claude.desktop/ai.claude.desktop.yml
          gpg-sign: ${{ steps.gpg.outputs.fingerprint }}
          # Uploaded ourselves below, after patching in --runtime-repo:
          # Flatter's own build-update-repo call only ever passes
          # --gpg-sign, so a fresh install from our repo alone fails with
          # "requires the runtime org.freedesktop.Platform/x86_64/25.08
          # which was not found" - flatpak has no other remote to check.
          upload-pages-artifact: false

      - name: Point installs at Flathub for missing runtimes
        env:
          FINGERPRINT: ${{ steps.gpg.outputs.fingerprint }}
        run: |
          args=(--runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo)
          [ -n "$FINGERPRINT" ] && args+=(--gpg-sign="$FINGERPRINT")
          flatpak build-update-repo "${args[@]}" "${{ steps.flatter.outputs.repository }}"
          cp README.md "${{ steps.flatter.outputs.repository }}/" || true

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.flatter.outputs.repository }}

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: flatter
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
